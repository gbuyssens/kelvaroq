[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "velkin-reference"
version = "0.2.0"
description = "Single-threaded x64 startup reference for Velkin"
requires-python = ">=3.10"
# GPL-2.0-or-later, not 3: it imports Unicorn, which is GPLv2 only.
license = { text = "GPL-2.0-or-later" }
dependencies = ["capstone==5.0.7", "unicorn==2.1.4"]

[project.optional-dependencies]
dev = ["ruff==0.17.6"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.setuptools]
packages = ["velkin_reference"]
