<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470" role="img" aria-label="Simplified view: other projects copy the game's memory back and forth every frame; Velkin gives the GPU the game's memory as on the console. The new memory layer is in testing.">
<title>How Velkin differs, simplified</title>
<rect width="1200" height="470" rx="14" fill="#171d1a"/>
<rect x="0.5" y="0.5" width="1199" height="469" rx="14" fill="none" stroke="#33403a"/>
<text x="40" y="52" font-family="Segoe UI Variable Display, Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="13" letter-spacing="1.5" fill="#94a39b">THE USUAL APPROACH · EVERY FRAME</text>
<rect x="40" y="72" width="220" height="70" rx="10" fill="#1f2622" stroke="#33403a" stroke-width="1.5"/>
<text x="150.0" y="104.0" text-anchor="middle" font-family="Segoe UI Variable Display, Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#e6ede8">Console game</text>
<text x="150.0" y="124.0" text-anchor="middle" font-family="Segoe UI Variable Display, Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="12.5" fill="#94a39b">native x64 code</text>
<rect x="400" y="72" width="240" height="70" rx="10" fill="#1f2622" stroke="#33403a" stroke-width="1.5"/>
<text x="520.0" y="104.0" text-anchor="middle" font-family="Segoe UI Variable Display, Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#e6ede8">Two copies of memory</text>
<text x="520.0" y="124.0" text-anchor="middle" font-family="Segoe UI Variable Display, Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="12.5" fill="#94a39b">RAM side · VRAM side</text>
<rect x="900" y="72" width="260" height="70" rx="10" fill="#1f2622" stroke="#33403a" stroke-width="1.5"/>
<text x="1030.0" y="104.0" text-anchor="middle" font-family="Segoe UI Variable Display, Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#e6ede8">GPU</text>
<text x="1030.0" y="124.0" text-anchor="middle" font-family="Segoe UI Variable Display, Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="12.5" fill="#94a39b">waits most of the frame</text>
<path id="a1" d="M260 107 L400 107" fill="none" stroke="#33403a" stroke-width="2"/>
<path id="a2" d="M640 98 L900 98" fill="none" stroke="#33403a" stroke-width="2"/>
<path id="a3" d="M900 118 L640 118" fill="none" stroke="#33403a" stroke-width="2"/>
<circle r="5" fill="#e3a440"><animateMotion dur="2.0s" begin="0.00s" repeatCount="indefinite" rotate="0"><mpath href="#a2"/></animateMotion></circle>
<circle r="5" fill="#e3a440"><animateMotion dur="2.0s" begin="0.50s" repeatCount="indefinite" rotate="0"><mpath href="#a2"/></animateMotion></circle>
<circle r="5" fill="#e3a440"><animateMotion dur="2.0s" begin="1.00s" repeatCount="indefinite" rotate="0"><mpath href="#a2"/></animateMotion></circle>
<circle r="5" fill="#e3a440"><animateMotion dur="2.0s" begin="1.50s" repeatCount="indefinite" rotate="0"><mpath href="#a2"/></animateMotion></circle>
<circle r="5" fill="#e3a440"><animateMotion dur="2.0s" begin="0.00s" repeatCount="indefinite" rotate="0"><mpath href="#a3"/></animateMotion></circle>
<circle r="5" fill="#e3a440"><animateMotion dur="2.0s" begin="0.50s" repeatCount="indefinite" rotate="0"><mpath href="#a3"/></animateMotion></circle>
<circle r="5" fill="#e3a440"><animateMotion dur="2.0s" begin="1.00s" repeatCount="indefinite" rotate="0"><mpath href="#a3"/></animateMotion></circle>
<circle r="5" fill="#e3a440"><animateMotion dur="2.0s" begin="1.50s" repeatCount="indefinite" rotate="0"><mpath href="#a3"/></animateMotion></circle>
<text x="770" y="88" text-anchor="middle" font-family="Segoe UI Variable Display, Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="12.5" fill="#e3a440">copy up</text>
<text x="770" y="140" text-anchor="middle" font-family="Segoe UI Variable Display, Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="12.5" fill="#e3a440">copy back</text>
<text x="40" y="180" font-family="Segoe UI Variable Display, Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="13.5" fill="#94a39b">Watch every page, copy what changed, copy the results back. Tuning this loop moves a few milliseconds; it never removes the loop.</text>
<line x1="40" y1="212" x2="1160" y2="212" stroke="#33403a" stroke-dasharray="4 6"/>
<text x="40" y="262" font-family="Segoe UI Variable Display, Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="13" letter-spacing="1.5" fill="#4fd08b">VELKIN · AS ON THE CONSOLE</text>
<rect x="40" y="282" width="220" height="70" rx="10" fill="#1f2622" stroke="#33403a" stroke-width="1.5"/>
<text x="150.0" y="314.0" text-anchor="middle" font-family="Segoe UI Variable Display, Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#e6ede8">Console game</text>
<text x="150.0" y="334.0" text-anchor="middle" font-family="Segoe UI Variable Display, Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="12.5" fill="#94a39b">native x64 code</text>
<path id="b1" d="M260 317 L980 317" fill="none" stroke="#4fd08b" stroke-width="2" stroke-opacity="0.45"/>
<circle r="5" fill="#4fd08b"><animateMotion dur="2.6s" begin="0.00s" repeatCount="indefinite" rotate="0"><mpath href="#b1"/></animateMotion></circle>
<circle r="5" fill="#4fd08b"><animateMotion dur="2.6s" begin="0.52s" repeatCount="indefinite" rotate="0"><mpath href="#b1"/></animateMotion></circle>
<circle r="5" fill="#4fd08b"><animateMotion dur="2.6s" begin="1.04s" repeatCount="indefinite" rotate="0"><mpath href="#b1"/></animateMotion></circle>
<circle r="5" fill="#4fd08b"><animateMotion dur="2.6s" begin="1.56s" repeatCount="indefinite" rotate="0"><mpath href="#b1"/></animateMotion></circle>
<circle r="5" fill="#4fd08b"><animateMotion dur="2.6s" begin="2.08s" repeatCount="indefinite" rotate="0"><mpath href="#b1"/></animateMotion></circle>
<rect x="400" y="272" width="440" height="90" rx="12" fill="#0f1311" stroke="#4fd08b" stroke-width="1.5"/>
<text x="620" y="312" text-anchor="middle" font-family="Segoe UI Variable Display, Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#e6ede8">Velkin memory layer</text>
<text x="620" y="336" text-anchor="middle" font-family="Segoe UI Variable Display, Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="12.5" fill="#94a39b">in testing</text>
<rect x="980" y="282" width="180" height="70" rx="10" fill="#1f2622" stroke="#33403a" stroke-width="1.5"/>
<text x="1070.0" y="314.0" text-anchor="middle" font-family="Segoe UI Variable Display, Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#e6ede8">GPU</text>
<text x="1070.0" y="334.0" text-anchor="middle" font-family="Segoe UI Variable Display, Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="12.5" fill="#94a39b">does the work</text>
<text x="40" y="410" font-family="Segoe UI Variable Display, Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="13.5" fill="#94a39b">One memory, seen by the CPU and the GPU alike, as the console was built. The copy loop is gone instead of tuned.</text>
<text x="40" y="440" font-family="Segoe UI Variable Display, Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="12" fill="#94a39b">Simplified on purpose: this picture shows what changes, not how.</text>
</svg>
