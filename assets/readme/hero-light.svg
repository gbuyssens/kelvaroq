<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-label="Velkin: the console game, running on PC">
<title>Velkin</title>
<rect width="1200" height="260" rx="14" fill="#f3f6f4"/>
<rect x="0.5" y="0.5" width="1199" height="259" rx="14" fill="none" stroke="#d3dcd6"/>
<g transform="translate(64 70)">
  <path d="M0 0 H28 L50 82 L72 0 H100 L64 120 H36 Z" fill="#1c8a52"/>
</g>
<text x="196" y="122" font-family="Segoe UI Variable Display, Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="64" font-weight="600" fill="#16201b" letter-spacing="-1">Velkin</text>
<text x="198" y="160" font-family="Segoe UI Variable Display, Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="20" fill="#5b6a62">Xbox Series compatibility runtime for Windows · Rust · DirectX 12</text>
