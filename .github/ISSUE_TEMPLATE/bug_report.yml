name: Bug report
description: Report a crash, a rendering problem or another Velkin bug.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a problem.

        > [!NOTE]
        > **You do not need to say which game you were playing.** Your hardware configuration, the steps you followed and the crash log are enough for us to look into the problem.

        > [!WARNING]
        > Do not attach or link game files, executables, keys, dumps or download links. Issues that contain or ask for them are removed.

  - type: input
    id: version
    attributes:
      label: Velkin version
      description: Shown in the launcher's About page, or the name of the release ZIP you downloaded.
      placeholder: "0.2.0"
    validations:
      required: true

  - type: textarea
    id: hardware
    attributes:
      label: Hardware configuration
      description: |
        The launcher's **Hardware profile** shows most of these values. Include the GPU driver version and, on a PC with several GPUs, the one used by `velkin-engine.exe`.
      value: |
        - CPU:
        - GPU:
        - GPU driver version:
        - VRAM:
        - RAM:
        - OS (Windows version and build):
        - Display resolution:
        - Engine settings (Automatic or Custom, and any `VICTORY_*` variable you set):
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the problem and what you expected to happen instead.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: What you did before the problem appeared, and whether it happens every time.
      placeholder: |
        1. Open Velkin.exe and select the game folder
        2. Start the game
        3. ...
    validations:
      required: false

  - type: textarea
    id: crash-log
    attributes:
      label: Crash log
      description: |
        Paste the content of the `*.crash.log` file written by the engine, or the end of the Velkin session log if there is no crash log. If the log is too long, attach the file in **Additional information** below.
        Remove personal information first, such as your user name in file paths.
      render: text
    validations:
      required: false

  - type: textarea
    id: extra
    attributes:
      label: Additional information
      description: Screenshots, frame times, or anything else that helps.
    validations:
      required: false
